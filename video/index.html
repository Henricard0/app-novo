<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ato falho</title>
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 500; src: url(fonts/Fredoka-Medium.ttf); }
  @font-face { font-family: 'Fredoka'; font-weight: 600; src: url(fonts/Fredoka-SemiBold.ttf); }
  @font-face { font-family: 'Fredoka'; font-weight: 700; src: url(fonts/Fredoka-Bold.ttf); }
  @font-face { font-family: 'Patrick Hand'; font-weight: 400; src: url(fonts/PatrickHand-Regular.ttf); }
  html, body { margin: 0; padding: 0; background: #222; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FFF8EC; }
  #svg { position: absolute; inset: 0; }
  #grain { position: absolute; inset: -60px; background: url(assets/paper_grain.png); mix-blend-mode: multiply; pointer-events: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
    background: radial-gradient(ellipse 80% 70% at 50% 45%, rgba(255,255,255,0) 60%, rgba(120,90,60,.16) 100%); }
  #cap { position: absolute; left: 90px; right: 90px; top: 1395px; height: 230px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #cap .box { position: relative; text-align: center; font-family: 'Fredoka'; font-weight: 600; font-size: 64px; line-height: 1.3; transform-origin: 50% 50%; max-width: 900px; text-wrap: balance; }
  #cap .bg, #cap .fg { display: inline; padding: 6px 26px; -webkit-box-decoration-break: clone; box-decoration-break: clone; border-radius: 16px; }
  #cap .bg { color: transparent; background: #FFFDF6; filter: url(#capRough); box-shadow: 0 7px 0 #D8C7A6; }
  #cap .layer { position: relative; }
  #cap .layer.top { position: absolute; inset: 0; }
  #cap .fg { color: #2A2F45; }
  #cap em { font-style: normal; color: #E8513F; }
  #cap .shadow { position: absolute; inset: 0; filter: blur(9px); opacity: .28; transform: translateY(12px); }
  #cap .shadow span { display: inline; padding: 6px 26px; background: #3a2a1a; color: transparent; -webkit-box-decoration-break: clone; box-decoration-break: clone; border-radius: 16px; }
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="cap"></div>
  <svg width="0" height="0" style="position:absolute">
    <filter id="capRough" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
</div>
<script src="src/timeline.gen.js"></script>
<script src="src/paper.js"></script>
<script src="src/chars.js"></script>
<script src="src/props.js"></script>
<script src="src/scenes.js"></script>
<script src="src/main.js"></script>
</body>
</html>
