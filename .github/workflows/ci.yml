name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar tipos
        run: npx tsc --noEmit
      - name: Empacotar o app (iOS, Android e web)
        run: npx expo export --platform ios --platform android --platform web --output-dir dist
        env:
          EXPO_OFFLINE: '1'
